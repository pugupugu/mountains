<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>100대 명산 등반 가이드</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root {
    --bg: #f5f3ee;
    --panel: #ffffff;
    --ink: #1f2a24;
    --muted: #6b756f;
    --line: #e3e0d8;
    --accent: #2f6b4f;
    --accent-soft: #e4efe8;
    --accent-deep: #173f2e;
    --done: #2b4c7e;
    /* 마커: 지도의 초록·베이지 위에서 잘 보이는 단풍 계열 */
    --h1: #f4a259; /* < 700m */
    --h2: #e76f2c; /* 700–1,099m */
    --h3: #c0392b; /* 1,100–1,499m */
    --h4: #7b1f2b; /* 1,500m+ */
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: "Pretendard", system-ui, -apple-system, "Malgun Gothic", sans-serif;
    background: var(--bg); color: var(--ink);
    display: grid; grid-template-rows: auto 1fr;
  }
  header {
    display: flex; align-items: center; gap: 16px;
    padding: 14px 20px; border-bottom: 1px solid var(--line); background: var(--panel);
  }
  header h1 { font-size: 18px; margin: 0; letter-spacing: -0.02em; }
  header h1 span { color: var(--accent); }
  .progress { margin-left: auto; display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); }
  .progress-bar { width: 140px; height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
  .progress-bar i { display: block; height: 100%; width: 0; background: var(--done); transition: width .3s; }
  .progress b { color: var(--ink); }

  main { display: grid; grid-template-columns: 360px 1fr; min-height: 0; }
  aside { display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--line); background: var(--panel); }
  .controls { padding: 14px 16px 10px; border-bottom: 1px solid var(--line); display: grid; gap: 10px; }
  .search {
    width: 100%; padding: 10px 12px; font: inherit; font-size: 14px;
    border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink);
  }
  .search:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    padding: 5px 10px; font: inherit; font-size: 12px; border-radius: 999px; cursor: pointer;
    border: 1px solid var(--line); background: var(--panel); color: var(--muted);
  }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  .row { display: flex; align-items: center; justify-content: space-between; font-size: 12px; color: var(--muted); }
  .row select { font: inherit; font-size: 12px; padding: 4px 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--ink); }

  ul.list { list-style: none; margin: 0; padding: 4px 0; overflow-y: auto; flex: 1; }
  ul.list li { margin: 0; }
  .item {
    width: 100%; display: grid; grid-template-columns: 28px 1fr auto; align-items: center; gap: 10px;
    padding: 10px 16px; border: 0; background: none; font: inherit; color: inherit; text-align: left; cursor: pointer;
  }
  .item:hover { background: var(--bg); }
  .item.active { background: var(--accent-soft); }
  .item .no { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .item .nm { font-size: 15px; font-weight: 600; }
  .item .lc { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .item .ht { font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; }
  .item .ht small { display: block; font-weight: 400; color: var(--done); font-size: 11px; }
  .empty { padding: 30px 16px; text-align: center; color: var(--muted); font-size: 14px; }

  .map-wrap { position: relative; min-height: 0; }
  #map { position: absolute; inset: 0; background: #dfe6e0; }
  .legend {
    position: absolute; left: 12px; bottom: 24px; z-index: 500;
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px;
    font-size: 11px; color: var(--muted); display: grid; gap: 4px;
  }
  .legend span { display: flex; align-items: center; gap: 6px; }
  .legend i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }

  .detail {
    position: absolute; top: 12px; right: 12px; z-index: 600; width: 360px; max-height: calc(100% - 24px);
    overflow-y: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    box-shadow: 0 8px 28px rgba(20, 40, 30, .15); display: none;
  }
  .detail.open { display: block; }
  .d-head { padding: 18px 18px 14px; background: linear-gradient(160deg, var(--accent), var(--accent-deep)); color: #fff; position: relative; }
  .d-head .close {
    /* z-index: 반투명(opacity) 텍스트가 버튼 위에 그려져 클릭을 가로채지 않도록 */
    position: absolute; top: 10px; right: 10px; z-index: 2; width: 36px; height: 36px; border-radius: 50%;
    border: 0; background: rgba(255,255,255,.18); color: #fff; font-size: 22px; cursor: pointer; line-height: 1;
  }
  .d-head .close:hover { background: rgba(255,255,255,.32); }
  .leaflet-interactive.mt-marker { filter: drop-shadow(0 1px 2px rgba(0, 0, 0, .45)); }
  .d-head .tag { font-size: 11px; opacity: .8; }
  .d-head h2 { margin: 4px 0 2px; font-size: 24px; letter-spacing: -0.02em; }
  .d-head .loc { font-size: 13px; opacity: .85; }
  .d-head .big { font-size: 34px; font-weight: 700; margin-top: 10px; font-variant-numeric: tabular-nums; }
  .d-head .big small { font-size: 14px; font-weight: 400; opacity: .8; }
  .d-body { padding: 16px 18px 18px; display: grid; gap: 14px; }
  .d-body p { margin: 0; font-size: 14px; line-height: 1.65; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .stat { background: var(--bg); border-radius: 8px; padding: 8px 10px; }
  .stat .k { font-size: 11px; color: var(--muted); }
  .stat .v { font-size: 13px; font-weight: 600; margin-top: 2px; }
  .dots { letter-spacing: 2px; color: var(--done); }
  .section-t { font-size: 12px; font-weight: 700; color: var(--accent); margin-bottom: 6px; }
  .course { font-size: 13px; line-height: 1.7; background: var(--accent-soft); border-radius: 8px; padding: 10px 12px; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn {
    flex: 1; min-width: 120px; padding: 10px; font: inherit; font-size: 13px; font-weight: 600; text-align: center;
    border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; text-decoration: none;
  }
  .btn.primary { background: var(--done); border-color: var(--done); color: #fff; }
  .btn.primary.is-done { background: var(--panel); color: var(--done); border-color: var(--done); }
  .note { font-size: 11px; color: var(--muted); line-height: 1.5; }

  .d-body > * { min-width: 0; } /* 썸네일 줄이 카드 폭을 넓히지 않도록 */
  .gallery { margin: -16px -18px 0; }
  .g-main { position: relative; aspect-ratio: 16 / 10; background: var(--bg); cursor: zoom-in; overflow: hidden; }
  .g-main img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .g-count { position: absolute; right: 8px; bottom: 8px; font-size: 11px; color: #fff; background: rgba(0,0,0,.55); padding: 2px 8px; border-radius: 999px; }
  .g-thumbs { display: flex; gap: 6px; padding: 8px 18px 0; overflow-x: auto; }
  .g-thumbs button { flex: 0 0 64px; height: 44px; padding: 0; border: 2px solid transparent; border-radius: 6px; overflow: hidden; cursor: pointer; background: var(--bg); }
  .g-thumbs button[aria-current="true"] { border-color: var(--accent); }
  .g-thumbs img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .credit { font-size: 10.5px; color: var(--muted); padding: 6px 18px 0; line-height: 1.4; overflow-wrap: anywhere; }
  .credit a { color: inherit; }
  .log { display: grid; gap: 8px; }
  .log .section-t { margin-bottom: 0; }
  .log-row { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
  .log input[type="date"], .log textarea {
    font: inherit; font-size: 13px; color: var(--ink); background: var(--bg);
    border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px;
  }
  .log textarea { resize: vertical; width: 100%; line-height: 1.5; }
  .log input:focus, .log textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .btn.upload { flex: none; }
  .link-btn { font: inherit; font-size: inherit; color: var(--done); background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline; }
  .no-photo { padding: 18px; text-align: center; font-size: 12px; color: var(--muted); background: var(--bg); }

  .lightbox { position: fixed; inset: 0; z-index: 2000; background: rgba(10, 16, 13, .92); display: none; flex-direction: column; align-items: center; justify-content: center; padding: 16px; }
  .lightbox.open { display: flex; }
  .lightbox img { max-width: 100%; max-height: calc(100vh - 110px); object-fit: contain; border-radius: 6px; }
  .lightbox .cap { color: #d6ddd8; font-size: 12px; margin-top: 10px; text-align: center; max-width: 900px; overflow-wrap: anywhere; }
  .lightbox .cap a { color: inherit; }
  .lb-btn { position: absolute; top: 50%; transform: translateY(-50%); width: 44px; height: 44px; border-radius: 50%; border: 0; background: rgba(255,255,255,.12); color: #fff; font-size: 22px; cursor: pointer; }
  .lb-btn:hover { background: rgba(255,255,255,.25); }
  .lb-prev { left: 16px; } .lb-next { right: 16px; }
  .lb-close { top: 16px; right: 16px; transform: none; }

  .leaflet-tooltip.mt-label { font-family: inherit; font-size: 12px; font-weight: 600; padding: 2px 6px; }

  @media (max-width: 820px) {
    body { height: auto; min-height: 100%; }
    header { flex-wrap: wrap; padding: 12px 16px; }
    .progress { margin-left: 0; width: 100%; }
    .progress-bar { flex: 1; }
    main { grid-template-columns: 1fr; grid-template-rows: 48vh auto; }
    .map-wrap { order: 1; height: 48vh; }
    aside { order: 2; border-right: 0; }
    ul.list { overflow: visible; }
    .detail { position: fixed; top: auto; right: 0; left: 0; bottom: 0; width: auto; max-height: 75vh; border-radius: 16px 16px 0 0; z-index: 1000; }
    .legend { bottom: 12px; }
  }
</style>
</head>
<body>
<header>
  <h1>⛰ 100대 명산 <span>등반 가이드</span></h1>
  <div class="progress" title="이 브라우저에 저장됩니다">
    <span>등반 완료 <b id="doneCount">0</b> / 100</span>
    <div class="progress-bar"><i id="doneBar"></i></div>
  </div>
</header>

<main>
  <aside>
    <div class="controls">
      <input id="q" class="search" type="search" placeholder="산 이름 또는 지역 검색 (예: 설악, 경북)" autocomplete="off">
      <div class="chips" id="regions"></div>
      <div class="row">
        <span id="count"></span>
        <label>정렬
          <select id="sort">
            <option value="name">이름순</option>
            <option value="hdesc">높은 순</option>
            <option value="hasc">낮은 순</option>
            <option value="diff">쉬운 순</option>
          </select>
        </label>
      </div>
    </div>
    <ul class="list" id="list"></ul>
  </aside>

  <div class="map-wrap">
    <div id="map"></div>
    <div class="legend">
      <span><i style="background:var(--h1)"></i>700m 미만</span>
      <span><i style="background:var(--h2)"></i>700–1,099m</span>
      <span><i style="background:var(--h3)"></i>1,100–1,499m</span>
      <span><i style="background:var(--h4)"></i>1,500m 이상</span>
      <span><i style="background:var(--done)"></i>등반 완료</span>
    </div>
    <section class="detail" id="detail" aria-live="polite"></section>
  </div>
</main>

<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="사진 크게 보기">
  <button class="lb-btn lb-close" data-lb="close" aria-label="닫기">×</button>
  <button class="lb-btn lb-prev" data-lb="prev" aria-label="이전 사진">‹</button>
  <img alt="">
  <div class="cap"></div>
  <button class="lb-btn lb-next" data-lb="next" aria-label="다음 사진">›</button>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="mountains.js"></script>
<script src="images.js"></script>
<script>
(() => {
  const REGIONS = ["전체", "수도권", "강원", "충청", "전라", "경상", "제주"];
  const DIFF = { 1: "쉬움", 2: "보통", 3: "어려움" };
  const STORE_KEY = "mt100-done";
  const LOG_KEY = "mt100-log";

  const mountains = MOUNTAINS.map((m, i) => ({ ...m, id: i + 1 }));
  const state = { q: "", region: "전체", sort: "name", selected: null, done: loadDone(), log: loadLog() };

  function loadDone() {
    try { return new Set(JSON.parse(localStorage.getItem(STORE_KEY) || "[]")); }
    catch { return new Set(); }
  }
  function saveDone() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify([...state.done])); } catch {}
  }
  function loadLog() {
    try { return JSON.parse(localStorage.getItem(LOG_KEY) || "{}"); }
    catch { return {}; }
  }
  function saveLog() {
    try { localStorage.setItem(LOG_KEY, JSON.stringify(state.log)); } catch {}
  }

  // ---- 내 사진 저장소 (IndexedDB, 이 브라우저에만 저장) ----
  const myPhotos = new Map(); // 산 id → [{ key, thumb(objectURL), mine: true }]
  const photoDb = new Promise((resolve) => {
    try {
      const req = indexedDB.open("mt100", 1);
      req.onupgradeneeded = () => req.result.createObjectStore("photos", { keyPath: "key", autoIncrement: true });
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => resolve(null);
    } catch { resolve(null); }
  });
  function tx(mode, fn) {
    return photoDb.then((db) => db && new Promise((resolve, reject) => {
      const t = db.transaction("photos", mode);
      const r = fn(t.objectStore("photos"));
      t.oncomplete = () => resolve(r?.result);
      t.onerror = () => reject(t.error);
    }));
  }
  const toMine = (rec) => ({ key: rec.key, thumb: URL.createObjectURL(rec.blob), mine: true });
  async function loadMyPhotos() {
    const all = (await tx("readonly", (s) => s.getAll()).catch(() => [])) || [];
    for (const rec of all) {
      if (!myPhotos.has(rec.mt)) myPhotos.set(rec.mt, []);
      myPhotos.get(rec.mt).push(toMine(rec));
    }
  }
  // 큰 사진은 긴 변 1600px JPEG로 줄여서 저장
  async function shrink(file) {
    try {
      const bmp = await createImageBitmap(file, { imageOrientation: "from-image" });
      const scale = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
      const c = document.createElement("canvas");
      c.width = Math.round(bmp.width * scale);
      c.height = Math.round(bmp.height * scale);
      c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
      return await new Promise((r) => c.toBlob((b) => r(b), "image/jpeg", 0.85));
    } catch { return null; } // 브라우저가 읽지 못하는 형식(예: 크롬의 HEIC)
  }
  // 저장하지 못한 파일 수를 돌려준다
  async function addMyPhotos(id, files) {
    let failed = 0;
    for (const f of files) {
      const blob = f.type.startsWith("image/") || /\.hei[cf]$/i.test(f.name) ? await shrink(f) : null;
      if (!blob) { failed++; continue; }
      const rec = { mt: id, blob, at: Date.now() };
      rec.key = await tx("readwrite", (s) => s.add(rec));
      if (!myPhotos.has(id)) myPhotos.set(id, []);
      myPhotos.get(id).push(toMine(rec));
    }
    return failed;
  }
  async function deleteMyPhoto(id, key) {
    await tx("readwrite", (s) => s.delete(key));
    const list = myPhotos.get(id) || [];
    const p = list.find((x) => x.key === key);
    if (p) URL.revokeObjectURL(p.thumb);
    myPhotos.set(id, list.filter((x) => x.key !== key));
  }
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const fmtH = (h) => h.toLocaleString("ko-KR");
  const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
  const heightColor = (h) => css(h < 700 ? "--h1" : h < 1100 ? "--h2" : h < 1500 ? "--h3" : "--h4");
  // 로컬(한국) 시간 기준 오늘 날짜 YYYY-MM-DD
  const today = () => { const d = new Date(); return new Date(d - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); };

  // ---- 지도 ----
  const map = L.map("map", { zoomControl: true }).setView([36.2, 127.8], 7);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 18,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
  }).addTo(map);

  const markers = new Map();
  for (const m of mountains) {
    const mk = L.circleMarker([m.lat, m.lng], { ...markerStyle(m, false), className: "mt-marker" })
      .bindTooltip(`${esc(m.name)} · ${fmtH(m.h)}m`, { className: "mt-label", direction: "top", offset: [0, -6] })
      .on("click", () => select(m.id, { fly: false }))
      .addTo(map);
    markers.set(m.id, mk);
  }

  function markerStyle(m, active) {
    const done = state.done.has(m.id);
    return {
      radius: active ? 11 : 6 + Math.min(m.h / 500, 3),
      color: "#ffffff",
      weight: active ? 3 : 2,
      fillColor: done ? css("--done") : heightColor(m.h),
      fillOpacity: 0.95,
    };
  }
  function refreshMarkers() {
    const visible = new Set(filtered().map((m) => m.id));
    for (const m of mountains) {
      const mk = markers.get(m.id);
      const show = visible.has(m.id);
      if (show && !map.hasLayer(mk)) mk.addTo(map);
      if (!show && map.hasLayer(mk)) mk.remove();
      mk.setStyle(markerStyle(m, m.id === state.selected));
      if (m.id === state.selected) mk.bringToFront();
    }
  }

  // ---- 리스트 ----
  const $list = document.getElementById("list");
  const $count = document.getElementById("count");
  const $regions = document.getElementById("regions");

  $regions.innerHTML = REGIONS.map((r) =>
    `<button class="chip" data-r="${r}" aria-pressed="${r === state.region}">${r}</button>`).join("");
  $regions.addEventListener("click", (e) => {
    const b = e.target.closest(".chip"); if (!b) return;
    state.region = b.dataset.r;
    $regions.querySelectorAll(".chip").forEach((c) => c.setAttribute("aria-pressed", c.dataset.r === state.region));
    render(true);
  });
  let searchTimer;
  document.getElementById("q").addEventListener("input", (e) => {
    state.q = e.target.value.trim();
    render(false);
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => render(true), 400); // 입력이 멈추면 지도 이동
  });
  document.getElementById("sort").addEventListener("change", (e) => { state.sort = e.target.value; render(false); });

  function filtered() {
    const terms = state.q.toLowerCase().split(/\s+/).filter(Boolean);
    return mountains.filter((m) => {
      const hay = `${m.name} ${m.loc} ${m.region} ${m.park || ""}`.toLowerCase();
      return (state.region === "전체" || m.region === state.region) && terms.every((t) => hay.includes(t));
    });
  }
  function sorted(list) {
    const by = {
      name: (a, b) => a.name.localeCompare(b.name, "ko"),
      hdesc: (a, b) => b.h - a.h,
      hasc: (a, b) => a.h - b.h,
      diff: (a, b) => a.diff - b.diff || a.h - b.h,
    }[state.sort];
    return [...list].sort(by);
  }

  function render(fit) {
    const list = sorted(filtered());
    $count.textContent = `${list.length}개 산`;
    $list.innerHTML = list.length ? list.map((m) => `
      <li><button class="item${m.id === state.selected ? " active" : ""}" data-id="${m.id}">
        <span class="no">${String(m.id).padStart(3, "0")}</span>
        <span><div class="nm">${esc(m.name)}</div><div class="lc">${esc(m.loc)}</div></span>
        <span class="ht">${fmtH(m.h)}m${state.done.has(m.id) ? `<small>✓ ${state.log[m.id]?.date ? esc(state.log[m.id].date.replaceAll("-", ".")) : "완료"}</small>` : ""}</span>
      </button></li>`).join("")
      : `<li class="empty">검색 결과가 없습니다.</li>`;
    refreshMarkers();
    if (fit && list.length) {
      const b = L.latLngBounds(list.map((m) => [m.lat, m.lng]));
      map.flyToBounds(b.pad(0.15), { maxZoom: 10, duration: 0.6 });
    }
    updateProgress();
  }
  $list.addEventListener("click", (e) => {
    const b = e.target.closest(".item"); if (b) select(+b.dataset.id, { fly: true });
  });

  // ---- 상세 ----
  const $detail = document.getElementById("detail");
  function select(id, { fly }) {
    state.selected = id;
    const m = mountains.find((x) => x.id === id);
    if (fly) map.flyTo([m.lat, m.lng], 11, { duration: 0.8 });
    renderDetail(m);
    render(false);
    const el = $list.querySelector(`.item[data-id="${id}"]`);
    if (el && !fly) el.scrollIntoView({ block: "nearest", behavior: "smooth" });
  }
  function renderDetail(m) {
    const done = state.done.has(m.id);
    const q = encodeURIComponent(m.name.replace(/\s*\(.+\)/, "") + " " + m.loc.split(" ")[0]);
    $detail.innerHTML = `
      <div class="d-head">
        <button class="close" aria-label="닫기">×</button>
        <div class="tag">No.${String(m.id).padStart(3, "0")} · ${esc(m.region)}${m.park ? " · " + esc(m.park) : ""}</div>
        <h2>${esc(m.name)}</h2>
        <div class="loc">${esc(m.loc)}</div>
        <div class="big">${fmtH(m.h)}<small> m</small></div>
      </div>
      <div class="d-body">
        ${galleryHtml(m)}
        <p>${esc(m.desc)}</p>
        <div class="stats">
          <div class="stat"><div class="k">난이도</div><div class="v"><span class="dots">${"●".repeat(m.diff)}${"○".repeat(3 - m.diff)}</span> ${DIFF[m.diff]}</div></div>
          <div class="stat"><div class="k">소요시간</div><div class="v">${esc(m.time)}</div></div>
          <div class="stat"><div class="k">추천 계절</div><div class="v">${esc(m.season)}</div></div>
        </div>
        <div>
          <div class="section-t">대표 등산 코스</div>
          <div class="course">${esc(m.course)}</div>
        </div>
        <div class="log">
          <div class="section-t">내 등반 기록</div>
          <label class="log-row">등반일 <input type="date" data-log="date" value="${esc(state.log[m.id]?.date || "")}" max="${today()}"></label>
          <textarea data-log="memo" rows="3" placeholder="함께 간 사람, 코스, 날씨, 느낀 점 등">${esc(state.log[m.id]?.memo || "")}</textarea>
          <label class="btn upload">📷 내 사진 추가<input type="file" accept="image/*" multiple hidden data-act="upload"></label>
          <div class="note">기록과 사진은 이 브라우저에만 저장됩니다.</div>
        </div>
        <div class="actions">
          <button class="btn primary${done ? " is-done" : ""}" data-act="done">${done ? "✓ 등반 완료됨" : "등반 완료 표시"}</button>
          <a class="btn" target="_blank" rel="noopener" href="https://map.naver.com/p/search/${q}">네이버 지도</a>
          <a class="btn" target="_blank" rel="noopener" href="https://map.kakao.com/?q=${q}">카카오맵</a>
          <a class="btn" target="_blank" rel="noopener" href="https://search.naver.com/search.naver?where=image&query=${q}">사진 더 보기</a>
        </div>
        <div class="note">좌표는 정상 부근 근삿값이며, 코스와 시간은 참고용입니다. 출입 통제·예약제 구간은 국립공원공단 등 공식 안내를 확인하세요.</div>
      </div>`;
    $detail.classList.add("open");
  }
  // ---- 사진 (Wikimedia Commons) ----
  const photosOf = (m) => [
    ...(myPhotos.get(m.id) || []),
    ...((typeof MOUNTAIN_IMAGES !== "undefined" && MOUNTAIN_IMAGES[m.name]) || []),
  ];
  const creditHtml = (p) => p.mine
    ? `내 사진 · <button class="link-btn" data-act="delphoto" data-key="${p.key}">삭제</button>`
    : `사진: ${esc(p.author)}${p.license ? " · " + esc(p.license) : ""} · <a href="${esc(p.page)}" target="_blank" rel="noopener">Wikimedia Commons</a>`;
  let photoIdx = 0;

  function galleryHtml(m) {
    const ps = photosOf(m);
    photoIdx = 0;
    if (!ps.length) return `<div class="gallery"><div class="no-photo">자유 라이선스 사진을 찾지 못했습니다.<br>‘내 사진 추가’로 직접 찍은 사진을 올리거나 ‘사진 더 보기’로 확인하세요.</div></div>`;
    return `<div class="gallery">
      <div class="g-main" data-act="zoom"><img src="${esc(ps[0].thumb)}" alt="${esc(m.name)} 사진 1"><span class="g-count">1 / ${ps.length}</span></div>
      ${ps.length > 1 ? `<div class="g-thumbs">${ps.map((p, i) =>
        `<button data-photo="${i}" aria-current="${i === 0}" aria-label="사진 ${i + 1}"><img loading="lazy" src="${esc(p.thumb)}" alt=""></button>`).join("")}</div>` : ""}
      <div class="credit">${creditHtml(ps[0])}</div>
    </div>`;
  }
  function showPhoto(i) {
    const m = mountains.find((x) => x.id === state.selected);
    const ps = photosOf(m);
    photoIdx = (i + ps.length) % ps.length;
    const p = ps[photoIdx];
    const main = $detail.querySelector(".g-main");
    main.querySelector("img").src = p.thumb;
    main.querySelector("img").alt = `${m.name} 사진 ${photoIdx + 1}`;
    main.querySelector(".g-count").textContent = `${photoIdx + 1} / ${ps.length}`;
    $detail.querySelectorAll(".g-thumbs button").forEach((b) => b.setAttribute("aria-current", +b.dataset.photo === photoIdx));
    $detail.querySelector(".credit").innerHTML = creditHtml(p);
    if ($lb.classList.contains("open")) fillLightbox(m, p);
  }

  const $lb = document.getElementById("lightbox");
  function fillLightbox(m, p) {
    const img = $lb.querySelector("img");
    img.src = p.mine ? p.thumb : p.thumb.replace(/\/\d+px-/, "/1600px-");
    img.onerror = () => { img.onerror = null; img.src = p.thumb; };
    img.alt = `${m.name} 사진 ${photoIdx + 1}`;
    $lb.querySelector(".cap").innerHTML = `${esc(m.name)} (${photoIdx + 1}/${photosOf(m).length}) · ${creditHtml(p)}`;
  }
  let lbReturnFocus = null;
  function openLightbox() {
    const m = mountains.find((x) => x.id === state.selected);
    lbReturnFocus = document.activeElement;
    $lb.classList.add("open");
    fillLightbox(m, photosOf(m)[photoIdx]);
    $lb.querySelector('[data-lb="close"]').focus();
  }
  function closeLightbox() {
    $lb.classList.remove("open");
    lbReturnFocus?.focus?.();
  }
  $lb.addEventListener("click", (e) => {
    const a = e.target.closest("[data-lb]")?.dataset.lb;
    if (a === "prev") showPhoto(photoIdx - 1);
    else if (a === "next") showPhoto(photoIdx + 1);
    else if (a === "close" || e.target === $lb) closeLightbox();
  });

  $detail.addEventListener("click", (e) => {
    const t = e.target.closest("[data-photo]");
    if (t) { showPhoto(+t.dataset.photo); return; }
    if (e.target.closest('[data-act="zoom"]')) { openLightbox(); return; }
    const del = e.target.closest('[data-act="delphoto"]');
    if (del) {
      if (!confirm("이 사진을 삭제할까요?")) return;
      const id = state.selected;
      deleteMyPhoto(id, +del.dataset.key).then(() => refreshGallery(id));
      return;
    }
    if (e.target.closest(".close")) {
      $detail.classList.remove("open"); state.selected = null; render(false); return;
    }
    if (e.target.closest('[data-act="done"]')) {
      const id = state.selected;
      if (state.done.has(id)) {
        state.done.delete(id);
        if (state.log[id]?.date) setLog(id, { date: "" }); // 완료 해제 시 등반일도 비움 (메모·사진은 유지)
      } else {
        state.done.add(id);
      }
      saveDone();
      renderDetail(mountains.find((x) => x.id === id));
      render(false);
    }
  });
  // 갤러리만 다시 그림 (메모 입력 중인 내용은 유지)
  function refreshGallery(id) {
    const m = mountains.find((x) => x.id === id);
    $detail.querySelector(".gallery").outerHTML = galleryHtml(m);
    $lb.classList.remove("open");
  }
  function setLog(id, patch) {
    state.log[id] = { ...state.log[id], ...patch };
    if (!state.log[id].date && !state.log[id].memo) delete state.log[id];
    saveLog();
  }
  $detail.addEventListener("input", (e) => {
    if (e.target.dataset.log === "memo") setLog(state.selected, { memo: e.target.value });
  });
  $detail.addEventListener("change", (e) => {
    const id = state.selected;
    if (e.target.dataset.log === "date") {
      setLog(id, { date: e.target.value });
      if (e.target.value && !state.done.has(id)) {
        state.done.add(id);
        saveDone();
        const b = $detail.querySelector('[data-act="done"]');
        b.classList.add("is-done");
        b.textContent = "✓ 등반 완료됨";
      }
      render(false);
    }
    if (e.target.dataset.act === "upload" && e.target.files.length) {
      const files = [...e.target.files];
      e.target.value = "";
      addMyPhotos(id, files)
        .then((failed) => {
          refreshGallery(id);
          if (failed) alert(`${failed}장은 이 브라우저에서 열 수 없는 형식이라 저장하지 못했습니다.\n(아이폰 HEIC 사진은 JPG로 변환해서 올려 주세요.)`);
        })
        .catch(() => alert("사진을 저장하지 못했습니다. 브라우저 저장 공간을 확인하세요."));
    }
  });

  document.addEventListener("keydown", (e) => {
    if ($lb.classList.contains("open")) {
      if (e.key === "Escape") closeLightbox();
      if (e.key === "ArrowLeft") showPhoto(photoIdx - 1);
      if (e.key === "ArrowRight") showPhoto(photoIdx + 1);
      return;
    }
    if (e.key === "Escape" && $detail.classList.contains("open")) $detail.querySelector(".close").click();
  });

  function updateProgress() {
    document.getElementById("doneCount").textContent = state.done.size;
    document.getElementById("doneBar").style.width = `${state.done.size}%`;
  }

  render(false);
  loadMyPhotos().then(() => { if (state.selected) refreshGallery(state.selected); });
})();
</script>
</body>
</html>
